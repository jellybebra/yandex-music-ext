<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Старый дизайн Яндекс Музыки</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: Arial, sans-serif;
        }

        body {
            box-sizing: border-box;
            width: 300px;
            margin: 0;
            padding: 18px;
            background: Canvas;
            color: CanvasText;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 17px;
            line-height: 1.3;
        }

        p {
            margin: 0;
            color: GrayText;
            font-size: 13px;
            line-height: 1.45;
        }

        .setting {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 18px;
        }

        .setting label {
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        input {
            position: relative;
            flex: 0 0 auto;
            width: 42px;
            height: 22px;
            margin: 0;
            appearance: none;
            border-radius: 999px;
            background: #9e9e9e;
            cursor: pointer;
            transition: background-color 150ms ease;
        }

        input::after {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgb(0 0 0 / 35%);
            content: '';
            transition: transform 150ms ease;
        }

        input:checked {
            background: #f2bd00;
        }

        input:checked::after {
            transform: translateX(20px);
        }

        input:focus-visible {
            outline: 2px solid #4d90fe;
            outline-offset: 2px;
        }

        #status {
            margin-top: 12px;
            font-size: 12px;
        }

        #status:empty {
            display: none;
        }

        .donation {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
        }

        .donation p {
            margin-bottom: 10px;
        }

        .disclaimer {
            margin-top: 14px;
            font-size: 11px;
        }

        .donation-link {
            display: block;
            box-sizing: border-box;
            width: 100%;
            padding: 9px 12px;
            border-radius: 8px;
            background: #f2bd00;
            color: #1a1a1a;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.3;
            text-align: center;
            text-decoration: none;
            transition: background-color 150ms ease;
        }

        .donation-link:hover {
            background: #ffd633;
        }

        .donation-link:focus-visible {
            outline: 2px solid #4d90fe;
            outline-offset: 2px;
        }
    </style>
    <script src="popup.js" defer></script>
</head>
<body>
    <h1>Старый дизайн</h1>
    <p>Управляет классическим отображением «Моей Волны». Открытые вкладки Музыки перезагрузятся.</p>
    <div class="setting">
        <label for="design-toggle">Изменения дизайна</label>
        <input id="design-toggle" type="checkbox" role="switch">
    </div>
    <p id="status" role="status" aria-live="polite">Загрузка…</p>
    <div class="donation">
        <p>Нравится расширение?</p>
        <a class="donation-link" href="https://pay.cloudtips.ru/p/8f144f28" target="_blank" rel="noopener noreferrer">
            Поддержать разработчика
        </a>
    </div>
    <p class="disclaimer">Неофициальное расширение, не связано с Яндексом. Донаты получает автор расширения.</p>
</body>
</html>
